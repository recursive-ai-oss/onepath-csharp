name: release

# Publishes the NuGet package RecursiveAI.OnePath when a v<version> tag is pushed, and RecursiveAI.OnePath.Scope alone, at its own
# version, when a scope-v<version> tag is pushed (never both from one tag). nuget.org trusts this
# workflow through Trusted Publishing: the job exchanges its GitHub identity token for
# a short-lived API key, so no key is stored in the repository or its secrets.
#
# Three jobs, each with only the permissions it needs:
#   verify   the tag is well formed, on main, CI passed on that commit, the changelog has the version
#   publish  build, test, pack, attest, push to nuget.org
#   release  create the GitHub release with the changelog section as notes and the packages attached
# For a scope-v tag the publish and release jobs are publish-scope and release-scope; verify is shared, because tools/release-checks.sh
# looks at the module's version and changelog when the tag starts with scope-v. The checks can be run by hand: tools/release-checks.sh.
on:
  push:
    tags: ['v*', 'scope-v*']

permissions: {}

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  # Deterministic paths in the published binaries and symbols come from Directory.Build.props (CI=true on GitHub), for src/ only.

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # Actions are pinned by commit because the publish job can obtain a publishing key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is well formed
        env:
          TAG: ${{ github.ref_name }}
        run: tools/release-checks.sh tag-form "$TAG"
      - name: Tag is on main
        run: |
          # Only commits that are already on main are published.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tagged commit is not on main"; exit 1; }
      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful ci run for $GITHUB_SHA; wait for CI on this commit and push the tag again"
            exit 1
          fi
      - name: Changelog has a section for the version
        env:
          TAG: ${{ github.ref_name }}
        run: tools/release-checks.sh changelog "$TAG"

  publish:
    needs: verify
    if: ${{ !startsWith(github.ref_name, 'scope-v') }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write       # nuget.org Trusted Publishing and the provenance attestation
      attestations: write   # provenance for the packages
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep build output out of the checkout
        run: echo "ONEPATH_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/OnePath/OnePath.csproj

      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: tools/release-checks.sh version "$TAG"

      # A tag that does not build and pass its tests never publishes.
      - name: Build
        run: ci/build.sh Release
      - name: Test
        run: ci/test.sh Release

      - name: Pack
        # The one shipped package, from the binaries the tests ran on. Symbols come out as a .snupkg file.
        run: |
          dotnet pack src/OnePath -c Release --no-build -o "$RUNNER_TEMP/packages"
          ls -l "$RUNNER_TEMP/packages"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg

      - name: Keep the packages for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg
          if-no-files-found: error

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: recursiveai.org

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # --no-symbols: pushing a .nupkg would otherwise also push the .snupkg beside it, and the next line pushes it again.
          dotnet nuget push "$RUNNER_TEMP/packages/*.nupkg" --api-key "$NUGET_API_KEY" --no-symbols \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "$RUNNER_TEMP/packages/*.snupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          # The notes are the changelog section of this version.
          tools/release-checks.sh notes "$TAG" > notes.md
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}" packages/*

  # The viewer module on its own. It is built and tested here, never in ci.yml, and restores only from nuget.org (no feed hook is set),
  # so the OneScope packages it references, and the RecursiveAI.OnePath version its package takes as a floor, have to be published before its tag.
  publish-scope:
    needs: verify
    if: ${{ startsWith(github.ref_name, 'scope-v') }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write       # nuget.org Trusted Publishing and the provenance attestation
      attestations: write   # provenance for the package
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep build output out of the checkout
        run: echo "ONEPATH_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/OnePath.Scope.Tests

      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: tools/release-checks.sh version "$TAG"

      # A tag that does not build and pass its tests never publishes.
      - name: Build
        run: dotnet build tests/OnePath.Scope.Tests -c Release --no-restore
      - name: Test
        run: dotnet test tests/OnePath.Scope.Tests -c Release --no-build

      - name: Pack
        # Exactly one package and its symbols. Packing restores and builds again on purpose: the module is tested against the library's source,
        # and the package must instead name the published RecursiveAI.OnePath as its floor (see the project file).
        run: |
          dotnet pack src/OnePath.Scope -c Release -o "$RUNNER_TEMP/packages"
          ls -l "$RUNNER_TEMP/packages"
          version="${GITHUB_REF_NAME#scope-v}"
          id=RecursiveAI.OnePath.Scope
          ls "$RUNNER_TEMP/packages/$id.$version.nupkg" "$RUNNER_TEMP/packages/$id.$version.snupkg"
          [ "$(find "$RUNNER_TEMP/packages" -type f | wc -l)" -eq 2 ] || { echo "::error::expected exactly the module package and its symbols"; exit 1; }
          unzip -p "$RUNNER_TEMP/packages/$id.$version.nupkg" "$id.nuspec" | grep -q 'id="RecursiveAI.OnePath" version="\[\?1\.2'

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg

      - name: Keep the packages for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scope-packages
          path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg
          if-no-files-found: error

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: recursiveai.org

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # --no-symbols: pushing a .nupkg would otherwise also push the .snupkg beside it, and the next line pushes it again.
          dotnet nuget push "$RUNNER_TEMP/packages/*.nupkg" --api-key "$NUGET_API_KEY" --no-symbols \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "$RUNNER_TEMP/packages/*.snupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  release-scope:
    needs: publish-scope
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scope-packages
          path: packages
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#scope-v}
          # The notes are the module's changelog section of this version.
          tools/release-checks.sh notes "$TAG" > notes.md
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}" packages/*
